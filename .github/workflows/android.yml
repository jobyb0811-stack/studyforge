name: Build debug APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Unit tests (informational)
        run: npm test
        continue-on-error: true
      - run: npm run build
      - name: Add Android platform if missing
        run: '[ -d android ] || npx cap add android'
      - name: Apply Kotlin AlarmPlugin overlay
        run: node scripts/patch-android.mjs
      - run: npx cap sync android
      - name: Use fixed debug signing key (so new APKs install over old ones)
        run: mkdir -p ~/.android && cp android-overlay/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StudyForge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: studyforge-debug-apk
          path: StudyForge.apk
      - name: Publish APK as a Release (plain .apk download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StudyForge build ${{ github.run_number }}
          files: StudyForge.apk
